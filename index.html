<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2B34">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>트레일로그 – 운동 기록</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEF0; --surface:#FFFFFF; --ink:#1B2B34; --muted:#5D6F79; --line:#CBD5DA;
  --run:#FF5A1F; --walk:#8A4FD8; --hike:#2F7D5B; --bike:#2563C9; --accent:var(--run);
  --warn:#B7791F; --bad:#C53030;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0E171C;--surface:#17242B;--ink:#E4ECEF;--muted:#8DA0AA;--line:#2A3B44;
    --run:#FF7A45;--walk:#A98BE8;--hike:#4DB283;--bike:#5B8FE8;color-scheme:dark;}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body[data-act="walk"]{--accent:var(--walk)} body[data-act="hike"]{--accent:var(--hike)} body[data-act="bike"]{--accent:var(--bike)}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 0 110px}

header{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.acts{display:flex;flex:1;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.acts button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:500;padding:8px 0;border-radius:999px;cursor:pointer}
.acts button[aria-pressed="true"]{background:var(--accent);color:#fff}
.acts button:disabled{opacity:.5}
.gps{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.gps i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.gps[data-q="good"] i{background:var(--hike)} .gps[data-q="ok"] i{background:var(--warn)} .gps[data-q="bad"] i{background:var(--bad)}

#map{height:42vh;min-height:240px;margin:0 14px;border-radius:14px;border:1px solid var(--line);z-index:0}
.recenter{position:relative}
.recenter button{position:absolute;right:24px;bottom:10px;z-index:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:13px}

.hero{padding:14px 18px 4px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hero .big{font-size:88px;font-weight:700;line-height:.85;color:var(--accent)}
.hero .unit{font-size:15px;color:var(--muted);margin-top:6px}
.hero .side{text-align:right}
.hero .side .num{font-size:40px;font-weight:600;line-height:1}
.hero .side .steps{font-size:30px;margin-top:10px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);margin:12px 14px 0;border-top:1px solid var(--line)}
.cell{padding:10px 4px 10px 4px;border-bottom:1px solid var(--line)}
.cell:not(:nth-child(3n)){border-right:1px solid var(--line);}
.cell:not(:nth-child(3n+1)){padding-left:12px}
.cell .num{font-size:28px;font-weight:600;line-height:1.1}
.cell small{display:block;color:var(--muted);font-size:12px}

.profile{margin:14px 14px 0}
.profile h2,.hist h2{font-size:14px;font-weight:700;margin:0 0 6px}
.profile canvas{width:100%;height:110px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}

.note{margin:12px 14px 0;padding:10px 12px;border-radius:10px;background:var(--surface);border-left:4px solid var(--warn);font-size:13px}
.note[hidden]{display:none}

.hist{margin:20px 14px 0}
.hist ul{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist li .meta{flex:1;font-size:13px;color:var(--muted)}
.hist li .meta b{color:var(--ink);font-weight:500;display:block;font-size:14px}
.hist li button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font:inherit;font-size:12px}
.empty{color:var(--muted);font-size:13px}

.controls{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:1000}
.controls button{font:inherit;font-weight:700;font-size:17px;border:0;border-radius:14px;padding:14px 0;cursor:pointer;flex:1;max-width:260px}
#btnMain{background:var(--accent);color:#fff}
#btnStop{background:var(--ink);color:var(--surface)}
#btnStop[hidden],#btnSim[hidden]{display:none}
#btnSim{background:none;border:1px solid var(--line)!important;color:var(--muted);flex:0 0 auto;padding:14px 14px;font-weight:500;font-size:14px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.leaflet-control-attribution{font-size:10px}
.me-icon{background:none;border:0}
.me-arrow{width:40px;height:40px;transition:transform .4s ease}
.me-arrow svg{width:40px;height:40px;overflow:visible}
.me-arrow circle{fill:var(--accent);stroke:#fff;stroke-width:3}
.me-arrow path{fill:var(--accent);stroke:#fff;stroke-width:2;stroke-linejoin:round;display:none}
.me-arrow.has-dir path{display:block}
@media (prefers-reduced-motion:reduce){.me-arrow{transition:none}}
</style>
</head>
<body data-act="run">
<div class="wrap">
  <header>
    <div class="acts" role="group" aria-label="운동 종류">
      <button data-act="walk" aria-pressed="false">걷기</button>
      <button data-act="run" aria-pressed="true">달리기</button>
      <button data-act="hike" aria-pressed="false">등산</button>
      <button data-act="bike" aria-pressed="false">자전거</button>
    </div>
    <div class="gps" id="gps" data-q="none"><i></i><span id="gpsTxt">GPS 대기</span></div>
  </header>

  <div class="recenter">
    <div id="map"></div>
    <button id="btnCenter" type="button">현재 위치</button>
  </div>

  <section class="hero">
    <div>
      <div class="big num" id="heroVal">--</div>
      <div class="unit" id="heroUnit">페이스 (분/km)</div>
    </div>
    <div class="side">
      <div class="num" id="time">00:00:00</div>
      <div class="unit">운동 시간</div>
      <div class="num steps" id="steps">0</div>
      <div class="unit" id="stepsUnit">걸음</div>
    </div>
  </section>

  <section class="grid">
    <div class="cell"><div class="num" id="dist">0.00</div><small>거리 km</small></div>
    <div class="cell"><div class="num" id="spd">0.0</div><small>현재 속도 km/h</small></div>
    <div class="cell"><div class="num" id="avg">0.0</div><small>평균 속도 km/h</small></div>
    <div class="cell"><div class="num" id="alt">--</div><small>고도 m</small></div>
    <div class="cell"><div class="num" id="gain">0</div><small>누적 상승 m</small></div>
    <div class="cell"><div class="num" id="max">0.0</div><small>최고 속도 km/h</small></div>
    <div class="cell"><div class="num" id="dir">--</div><small id="dirTxt">진행 방향</small></div>
    <div class="cell"><div class="num" id="avgPace">--</div><small>평균 페이스 분/km</small></div>
    <div class="cell"><div class="num" id="loss">0</div><small>누적 하강 m</small></div>
  </section>

  <section class="profile">
    <h2>고도 프로필</h2>
    <canvas id="chart" aria-label="거리별 고도 그래프"></canvas>
  </section>

  <p class="note" id="note" hidden></p>

  <section class="hist">
    <h2>지난 기록</h2>
    <ul id="histList"></ul>
  </section>
</div>

<div class="controls">
  <button id="btnSim" type="button">시뮬레이션</button>
  <button id="btnMain" type="button">시작</button>
  <button id="btnStop" type="button" hidden>종료</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const ACT = {walk:'걷기', run:'달리기', hike:'등산', bike:'자전거'};
const DIRS = ['북','북동','동','남동','남','남서','서','북서'];
const HDG_STEP_M = 8;
const STRIDE = {walk:0.7, run:1.0, hike:0.6, bike:0}; // 센서가 없을 때 쓰는 평균 보폭(m)        // 방향 계산에 쓰는 최소 이동 거리
const STORE = 'trailog:sessions';
const MIN_STEP_M = 3;        // 이보다 짧은 이동은 GPS 떨림으로 보고 무시
const MAX_ACC_M = 35;        // 정확도가 이보다 나쁘면 기록에서 제외
const ALT_STEP_M = 3;        // 누적 상승 계산 시 무시할 고도 흔들림

let act = 'run', status = 'idle';   // idle | running | paused
let pts = [], dist = 0, gain = 0, loss = 0, heading = null, hdgFrom = null, maxSpd = 0, curSpd = 0, altSmooth = null, altRef = null;
let elapsed = 0, resumeAt = 0, watchId = null, tick = null, wakeLock = null, sim = null, follow = true;
let lastFix = null;
let steps = 0, stepTimes = [], motionOn = false, motionSeen = false, gAvg = null, sm = 0, above = false, lastStepT = 0;

// ---------- 걸음 수 (가속도 센서) ----------
function onMotion(e){
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  motionSeen = true;
  if (status !== 'running' || act === 'bike') return;
  const m = Math.hypot(a.x, a.y, a.z);
  gAvg = gAvg == null ? m : gAvg*0.97 + m*0.03;   // 중력 성분(느린 평균)
  sm = sm*0.6 + (m - gAvg)*0.4;                   // 흔들림 성분 스무딩
  const now = performance.now();
  // 위로 튀는 피크 1번 = 1걸음, 너무 빠른 연속 피크(0.28초 이내)는 무시
  if (!above && sm > 1.1 && now - lastStepT > 280) { above = true; lastStepT = now; steps++; stepTimes.push(Date.now()); }
  else if (above && sm < 0.3) above = false;
}
function enableMotion(){
  if (motionOn) return;
  const add = () => { window.addEventListener('devicemotion', onMotion); motionOn = true; };
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
    // 아이폰: 버튼을 누른 순간에만 권한 요청 가능
    DeviceMotionEvent.requestPermission()
      .then(r => r === 'granted' ? add() : showNote('동작 센서 권한이 거부되어 걸음 수를 이동 거리로 추정합니다.'))
      .catch(() => {});
  } else if ('DeviceMotionEvent' in window) add();
}
function shownSteps(){
  if (act === 'bike') return null;
  return motionSeen && !sim ? steps : Math.round(dist / STRIDE[act]);
}

// ---------- 지도 ----------
const map = L.map('map', {zoomControl:false}).setView([37.5665, 126.978], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19, attribution:'&copy; OpenStreetMap'
}).addTo(map);
const track = L.polyline([], {color:getAccent(), weight:5, opacity:.9}).addTo(map);
const me = L.marker([0,0], {interactive:false, keyboard:false, icon:L.divIcon({className:'me-icon', iconSize:[40,40], iconAnchor:[20,20],
  html:'<div class="me-arrow"><svg viewBox="0 0 40 40"><path d="M20 1 L28 14 L20 10.5 L12 14 Z"/><circle cx="20" cy="20" r="9"/></svg></div>'})});
const accCircle = L.circle([0,0], {radius:0, weight:0, fillColor:getAccent(), fillOpacity:.12});
map.on('dragstart', () => follow = false);
$('btnCenter').onclick = () => { follow = true; if (lastFix) map.setView(lastFix, Math.max(map.getZoom(),16)); };

function getAccent(){ return getComputedStyle(document.body).getPropertyValue('--accent').trim() || '#FF5A1F'; }
function recolor(){ const c = getAccent(); track.setStyle({color:c}); accCircle.setStyle({fillColor:c}); }

// ---------- 운동 종류 ----------
document.querySelectorAll('.acts button').forEach(b => b.onclick = () => {
  if (status !== 'idle') return;
  act = b.dataset.act; document.body.dataset.act = act;
  document.querySelectorAll('.acts button').forEach(x => x.setAttribute('aria-pressed', x === b));
  recolor(); render();
});

// ---------- 계산 ----------
function haversine(a, b){
  const R = 6371000, r = Math.PI/180;
  const dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a, b){
  const r = Math.PI/180, y = Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r);
  const x = Math.cos(a.lat*r)*Math.sin(b.lat*r) - Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return (Math.atan2(y, x)/r + 360) % 360;
}
function updateHeading(fix){
  if (fix.acc > MAX_ACC_M) return;
  // 1순위: 기기가 주는 heading (이동 중일 때만 신뢰), 2순위: 직전 위치와의 방위각
  if (fix.hdg != null && !isNaN(fix.hdg) && (fix.spd || 0) > 0.5) { heading = fix.hdg; hdgFrom = fix; }
  else if (!hdgFrom) hdgFrom = fix;
  else if (haversine(hdgFrom, fix) >= HDG_STEP_M) { heading = bearing(hdgFrom, fix); hdgFrom = fix; }
  const el = me.getElement() && me.getElement().querySelector('.me-arrow');
  if (el && heading != null) {
    // 359°→1° 처럼 넘어갈 때 한 바퀴 도는 애니메이션 방지
    const prev = parseFloat(el.dataset.rot || heading);
    const rot = prev + ((heading - prev % 360 + 540) % 360 - 180);
    el.dataset.rot = rot; el.style.transform = `rotate(${rot}deg)`; el.classList.add('has-dir');
  }
}
const nowElapsed = () => elapsed + (status === 'running' ? Date.now() - resumeAt : 0);
const fmtTime = ms => { const s = Math.floor(ms/1000); return [s/3600, s%3600/60, s%60].map(v => String(Math.floor(v)).padStart(2,'0')).join(':'); };
const fmtPace = kmh => { if (kmh < 1) return '--'; const m = 60/kmh; return Math.floor(m) + ':' + String(Math.round((m%1)*60)%60).padStart(2,'0'); };

// ---------- 위치 수신 ----------
function onPos(p){
  const c = p.coords;
  const fix = {lat:c.latitude, lon:c.longitude, alt:c.altitude, acc:c.accuracy, t:p.timestamp || Date.now(), spd:c.speed, hdg:c.heading};
  lastFix = [fix.lat, fix.lon];
  // GPS 상태 표시
  const g = $('gps'); g.dataset.q = fix.acc <= 10 ? 'good' : fix.acc <= MAX_ACC_M ? 'ok' : 'bad';
  $('gpsTxt').textContent = '±' + Math.round(fix.acc) + 'm';
  me.setLatLng(lastFix); accCircle.setLatLng(lastFix).setRadius(fix.acc);
  if (!map.hasLayer(me)) { accCircle.addTo(map); me.addTo(map); map.setView(lastFix, 16); }
  updateHeading(fix);
  if (follow) map.panTo(lastFix, {animate:true});

  // 고도 스무딩 (GPS 고도는 흔들림이 큼)
  if (fix.alt != null) altSmooth = altSmooth == null ? fix.alt : altSmooth*0.8 + fix.alt*0.2;

  if (status !== 'running' || fix.acc > MAX_ACC_M) { render(); return; }

  const prev = pts[pts.length-1];
  if (!prev) { addPoint(fix); render(); return; }
  const d = haversine(prev, fix), dt = (fix.t - prev.t)/1000;
  let v = fix.spd != null && fix.spd >= 0 ? fix.spd : (dt > 0 ? d/dt : 0); // m/s
  if (v*3.6 > 120) { render(); return; }                       // 비정상 점프 제거
  curSpd = curSpd*0.6 + v*3.6*0.4;
  if (d >= MIN_STEP_M) {
    dist += d; addPoint(fix);
    if (curSpd > maxSpd) maxSpd = curSpd;
  } else if (dt > 5) curSpd *= 0.5;                              // 멈춰 있으면 속도 감소
  render();
}
function addPoint(fix){
  const alt = altSmooth;
  if (alt != null) {
    if (altRef == null) altRef = alt;
    else if (alt - altRef >= ALT_STEP_M) { gain += alt - altRef; altRef = alt; }
    else if (altRef - alt >= ALT_STEP_M) { loss += altRef - alt; altRef = alt; }
  }
  pts.push({lat:fix.lat, lon:fix.lon, alt, t:fix.t, d:dist});
  track.addLatLng([fix.lat, fix.lon]);
}
function onErr(e){
  const msg = {1:'위치 권한이 거부되었습니다. 브라우저 설정에서 이 사이트의 위치 권한을 허용하세요.',
               2:'위치를 찾을 수 없습니다. 실외로 이동하거나 GPS를 켜세요.',
               3:'위치 응답 시간이 초과되었습니다. 잠시 후 다시 시도합니다.'}[e.code] || e.message;
  showNote(msg); $('gps').dataset.q = 'bad'; $('gpsTxt').textContent = '오류';
}
function startWatch(){
  if (sim || watchId != null) return;
  if (!('geolocation' in navigator)) { showNote('이 브라우저는 위치 기능을 지원하지 않습니다.'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:20000});
}

// ---------- 화면 꺼짐 방지 ----------
async function keepAwake(){
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch(_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && status === 'running') keepAwake();
});

// ---------- 시작 / 일시정지 / 종료 ----------
$('btnMain').onclick = () => {
  if (status === 'idle') { enableMotion(); reset(); status = 'running'; resumeAt = Date.now(); startWatch(); keepAwake(); tick = setInterval(render, 1000); }
  else if (status === 'running') { elapsed += Date.now() - resumeAt; status = 'paused'; curSpd = 0; }
  else { status = 'running'; resumeAt = Date.now(); keepAwake(); }
  render();
};
$('btnStop').onclick = () => {
  if (status === 'running') elapsed += Date.now() - resumeAt;
  status = 'idle'; clearInterval(tick); curSpd = 0;
  if (wakeLock) { wakeLock.release().catch(()=>{}); wakeLock = null; }
  if (pts.length > 1) saveSession();
  if (sim) { clearInterval(sim.timer); sim = null; $('btnSim').hidden = false; }
  render(); renderHist();
};
function reset(){
  pts = []; dist = 0; gain = 0; loss = 0; steps = 0; stepTimes = []; gAvg = null; sm = 0; above = false; maxSpd = 0; curSpd = 0; altRef = null; elapsed = 0;
  track.setLatLngs([]);
}

// ---------- 화면 갱신 ----------
function render(){
  const ms = nowElapsed(), km = dist/1000, avg = ms > 0 ? km/(ms/3600000) : 0;
  $('time').textContent = fmtTime(ms);
  $('dist').textContent = km.toFixed(2);
  $('spd').textContent = curSpd.toFixed(1);
  $('avg').textContent = avg.toFixed(1);
  $('max').textContent = maxSpd.toFixed(1);
  $('alt').textContent = altSmooth == null ? '--' : Math.round(altSmooth);
  $('gain').textContent = Math.round(gain);
  $('loss').textContent = Math.round(loss);
  const st = shownSteps();
  stepTimes = stepTimes.filter(t => t > Date.now() - 30000);
  $('steps').textContent = st == null ? '--' : st.toLocaleString('ko-KR');
  $('stepsUnit').textContent = act === 'bike' ? '걸음 (자전거 제외)'
    : (!motionSeen || sim) ? '걸음 (거리로 추정)'
    : (status === 'running' && stepTimes.length > 4) ? `걸음, 분당 ${stepTimes.length*2}` : '걸음';
  $('avgPace').textContent = fmtPace(avg);
  $('dir').textContent = heading == null ? '--' : Math.round(heading) + '°';
  $('dirTxt').textContent = heading == null ? '진행 방향' : '진행 방향 ' + DIRS[Math.round(heading/45) % 8];
  if (act === 'run' || act === 'walk') { $('heroVal').textContent = fmtPace(curSpd); $('heroUnit').textContent = '페이스 (분/km)'; }
  else { $('heroVal').textContent = curSpd.toFixed(1); $('heroUnit').textContent = '속도 (km/h)'; }
  $('btnMain').textContent = {idle:'시작', running:'일시정지', paused:'계속'}[status];
  $('btnStop').hidden = status === 'idle';
  $('btnSim').hidden = status !== 'idle' || !!sim;
  document.querySelectorAll('.acts button').forEach(b => b.disabled = status !== 'idle');
  drawChart();
}

function drawChart(){
  const cv = $('chart'), dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.clearRect(0,0,w,h);
  const data = pts.filter(p => p.alt != null);
  const cs = getComputedStyle(document.body);
  ctx.font = '12px "Noto Sans KR", sans-serif';
  if (data.length < 2) { ctx.fillStyle = cs.getPropertyValue('--muted'); ctx.fillText('기록을 시작하면 고도 변화가 여기에 그려집니다', 12, h/2+4); return; }
  let lo = Math.min(...data.map(p=>p.alt)), hi = Math.max(...data.map(p=>p.alt));
  if (hi - lo < 10) { const m = (hi+lo)/2; lo = m-5; hi = m+5; }
  const maxD = data[data.length-1].d || 1, pad = 8;
  const x = d => pad + (d/maxD)*(w-pad*2), y = a => h-pad - ((a-lo)/(hi-lo))*(h-pad*2-14);
  ctx.beginPath(); ctx.moveTo(x(data[0].d), h-pad);
  data.forEach(p => ctx.lineTo(x(p.d), y(p.alt)));
  ctx.lineTo(x(data[data.length-1].d), h-pad); ctx.closePath();
  ctx.globalAlpha = .18; ctx.fillStyle = getAccent(); ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); data.forEach((p,i) => i ? ctx.lineTo(x(p.d), y(p.alt)) : ctx.moveTo(x(p.d), y(p.alt)));
  ctx.strokeStyle = getAccent(); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = cs.getPropertyValue('--muted');
  ctx.fillText(Math.round(hi) + 'm', pad+2, 14);
  ctx.fillText(Math.round(lo) + 'm', pad+2, h-pad-4);
}

// ---------- 기록 저장 / GPX 내보내기 ----------
function loadSessions(){ try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch(_) { return []; } }
function saveSession(){
  const s = {id:Date.now(), act, start:pts[0].t, ms:elapsed, dist, gain, loss, maxSpd, steps:shownSteps(),
             pts:pts.map(p => [+p.lat.toFixed(6), +p.lon.toFixed(6), p.alt == null ? null : +p.alt.toFixed(1), p.t])};
  const all = loadSessions(); all.unshift(s);
  try { localStorage.setItem(STORE, JSON.stringify(all.slice(0, 30))); }
  catch(_) { showNote('저장 공간이 부족해 기록을 저장하지 못했습니다. 오래된 기록을 삭제하세요.'); }
}
function renderHist(){
  const list = $('histList'), all = loadSessions();
  list.innerHTML = all.length ? '' : '<li class="empty">아직 저장된 기록이 없습니다. 시작을 눌러 첫 운동을 기록하세요.</li>';
  all.forEach(s => {
    const li = document.createElement('li'), d = new Date(s.start);
    li.innerHTML = `<div class="meta"><b>${ACT[s.act]} ${(s.dist/1000).toFixed(2)}km</b>${d.toLocaleDateString('ko-KR')} ${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} · ${fmtTime(s.ms)} · 상승 ${Math.round(s.gain)}m 하강 ${Math.round(s.loss || 0)}m${s.steps != null ? ' · ' + s.steps.toLocaleString('ko-KR') + '걸음' : ''}</div>`;
    const bShow = Object.assign(document.createElement('button'), {textContent:'지도'});
    const bGpx = Object.assign(document.createElement('button'), {textContent:'GPX'});
    const bDel = Object.assign(document.createElement('button'), {textContent:'삭제'});
    bShow.onclick = () => { if (status !== 'idle') return; track.setLatLngs(s.pts.map(p => [p[0], p[1]])); follow = false; map.fitBounds(track.getBounds(), {padding:[20,20]}); window.scrollTo({top:0, behavior:'smooth'}); };
    bGpx.onclick = () => exportGpx(s);
    bDel.onclick = () => { if (confirm('이 기록을 삭제할까요?')) { localStorage.setItem(STORE, JSON.stringify(loadSessions().filter(x => x.id !== s.id))); renderHist(); } };
    li.append(bShow, bGpx, bDel); list.append(li);
  });
}
function exportGpx(s){
  const type = {walk:'walking', run:'running', hike:'hiking', bike:'cycling'}[s.act];
  const trk = s.pts.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[2] != null ? `<ele>${p[2]}</ele>` : ''}<time>${new Date(p[3]).toISOString()}</time></trkpt>`).join('\n');
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Trailog" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${type} ${new Date(s.start).toISOString()}</name><type>${type}</type><trkseg>\n${trk}\n</trkseg></trk></gpx>`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([gpx], {type:'application/gpx+xml'}));
  a.download = `trailog_${type}_${new Date(s.start).toISOString().slice(0,16).replace(/[:T]/g,'')}.gpx`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- 시뮬레이션 (PC에서 테스트용) ----------
$('btnSim').onclick = () => {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  const c = map.getCenter(); let lat = c.lat, lon = c.lng, hd = Math.random()*Math.PI*2, k = 0;
  const base = {walk:1.4, run:3.2, hike:1.3, bike:6.5}[act];       // m/s
  sim = {timer:setInterval(() => {
    hd += (Math.random()-.5)*.4; const v = base*(.8 + Math.random()*.4);
    lat += Math.cos(hd)*v/111320; lon += Math.sin(hd)*v/(111320*Math.cos(lat*Math.PI/180)); k++;
    onPos({timestamp:Date.now(), coords:{latitude:lat, longitude:lon, accuracy:5+Math.random()*6, speed:v, heading:(hd*180/Math.PI % 360 + 360) % 360,
           altitude:120 + 40*Math.sin(k/60) + (act==='hike' ? k*.4 : 0) + (Math.random()-.5)*2}});
  }, 1000)};
  showNote('시뮬레이션 모드입니다. 지도 중심에서 가상의 경로로 1초마다 위치가 들어옵니다.');
  $('btnMain').click();
};

// ---------- 공통 ----------
function showNote(t){ const n = $('note'); n.textContent = t; n.hidden = false; }
if (!window.isSecureContext) showNote('위치 기능은 HTTPS 주소(또는 localhost)에서만 동작합니다. 휴대폰에서는 HTTPS로 배포된 주소로 접속하세요.');
window.addEventListener('resize', drawChart);
startWatch(); render(); renderHist();
})();
</script>
